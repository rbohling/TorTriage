name: TorTriage tests

on:
  pull_request:
  push:
    branches:
      - main
      - fix/unverified-measurement-circuit-attribution

permissions:
  contents: read

jobs:
  tests:
    name: Offline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and declared dependencies
        run: python -m pip install .
      # Tests mock HTTP sessions and Tor control access; no Tor daemon is needed.
      - name: Run offline regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  shadow:
    name: Shadow demo integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Provision the Shadow demo
        run: sudo bash demo/provision.sh --ci
      - name: Run baseline and constrained scenarios
        run: |
          shadow --version
          tortriage-demo baseline
          tortriage-demo constrained
      - name: Verify dashboard reports
        run: |
          /usr/bin/python3 /opt/tortriage/demo/dashboard.py >"$RUNNER_TEMP/dashboard.log" 2>&1 &
          dashboard_pid=$!
          trap 'kill "$dashboard_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 5 --retry-connrefused \
            http://127.0.0.1:8787/ --output "$RUNNER_TEMP/dashboard.html"
          curl --fail --silent --show-error http://127.0.0.1:8787/api/results \
            --output "$RUNNER_TEMP/dashboard-results.json"
          python3 - "$RUNNER_TEMP/dashboard-results.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          reports = json.loads(Path(sys.argv[1]).read_text())
          for scenario in ("baseline", "constrained"):
              report = reports[scenario]
              assert report["demo"]["scenario"] == scenario, scenario
              assert report["demo"]["successful"] == report["summary"]["runs"] == 4, scenario
              assert all(sample["circuit"]["attribution"] == "unverified" for sample in report["results"])
          baseline = reports["baseline"]["summary"]["avg_throughput_mbps"]
          constrained = reports["constrained"]["summary"]["avg_throughput_mbps"]
          assert 0 < constrained < baseline, (baseline, constrained)
          print(f"Baseline {baseline} Mbps, constrained {constrained} Mbps")
          PY
      - name: Upload Shadow reports and logs
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: shadow-demo-results
          path: |
            /var/lib/tortriage/baseline.json
            /var/lib/tortriage/constrained.json
            /var/lib/tortriage/*/shadow.log
            ${{ runner.temp }}/dashboard.log
          if-no-files-found: warn
