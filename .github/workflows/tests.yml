name: Offline regression tests

on:
  pull_request:
  push:
    branches:
      - main
      - fix/unverified-measurement-circuit-attribution

permissions:
  contents: read

jobs:
  tests:
    name: Offline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and declared dependencies
        run: python -m pip install .
      # Tests mock HTTP sessions and Tor control access; no Tor daemon is needed.
      - name: Run offline regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
